services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: afribit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: afribit
      POSTGRES_PASSWORD: afribit
      POSTGRES_DB: afribit
    ports:
      - "5432:5432"
    volumes:
      - afribit_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: afribit-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  afribit_pgdata:
